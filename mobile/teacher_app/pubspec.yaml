name: teacher_app
description: "Class attendance for Star Shiksha Paribar teachers"
publish_to: 'none'

# versionName+versionCode of the APK. Raise both for every release.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  generate: true # lib/l10n/*.arb → AppLocalizations
  assets:
    - assets/images/school_logo.png
  fonts:
    # Hind Siliguri (SIL Open Font License, assets/fonts/OFL.txt): Bangla and Latin.
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
