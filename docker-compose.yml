services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # PostgreSQL by default. Rollback to MySQL (until it is retired):
      # DB_DIALECT=mysql DB_HOST=db DB_USER=root DB_PASSWORD=<mysql root password>
      # and `docker compose --profile mysql up -d` — see docs/postgres-cutover.md.
      - DB_DIALECT=${DB_DIALECT:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-}
      - DB_USER=${DB_USER:-school}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      - DB_NAME=${DB_NAME:-School_Management}
      - DB_TIMEZONE=${DB_TIMEZONE:-Asia/Dhaka}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30h}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME in .env}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY in .env}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET in .env}
      - FRONTEND_URL=http://localhost:5174
      - TRUST_PROXY=${TRUST_PROXY:-}
      - JOB_APPLICATIONS_PER_HOUR=${JOB_APPLICATIONS_PER_HOUR:-10}
      - TEACHER_APP_LOGINS_PER_15_MINUTES=${TEACHER_APP_LOGINS_PER_15_MINUTES:-20}
      - ATTENDANCE_SMS_ENABLED=${ATTENDANCE_SMS_ENABLED:-false}
      - ATTENDANCE_SMS_DELAY_MINUTES=${ATTENDANCE_SMS_DELAY_MINUTES:-15}
      - SMS_PROVIDER=${SMS_PROVIDER:-log}
      - SMS_API_URL=${SMS_API_URL:-https://bulksmsbd.net/api/smsapi}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_SENDER_ID=${SMS_SENDER_ID:-}
      - SMS_SIGNATURE=${SMS_SIGNATURE:-স্টার শিক্ষা পরিবার}
    volumes:
      # Uploaded files outlive the container: posters and photos (served),
      # applicants' CVs (private, never served).
      - uploads:/app/public/uploads
      - private_uploads:/app/private_uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - school-network

  # Applies pending database migrations (server/db/migrations), then exits.
  # The backend starts only after it succeeded.
  migrate:
    build: ./server
    command: ["node", "scripts/migrate.js"]
    environment:
      - DB_HOST=postgres
      - DB_USER=school
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-School_Management}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - school-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - school-network

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-School_Management}
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Dhaka
      PGTZ: Asia/Dhaka
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - school-network

  # The old MySQL database: kept, untouched, for the data copy and for
  # rollback until PostgreSQL has been signed off (docs/postgres-cutover.md).
  # Starts only with `docker compose --profile mysql ...`.
  db:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-School_Management}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/Sql/database.sql:/docker-entrypoint-initdb.d/database.sql
      # runs after database.sql (alphabetical): the family's branches
      - ./server/Sql/star_family_branches_migration.sql:/docker-entrypoint-initdb.d/zz_star_family_branches.sql
    restart: unless-stopped
    healthcheck:
      # $$ = read the password inside the container, not from this file
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
    networks:
      - school-network

volumes:
  postgres_data:
  mysql_data:
  uploads:
  private_uploads:

networks:
  school-network:
    driver: bridge
