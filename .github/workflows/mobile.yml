name: Teacher app

# The class teachers' Android app (mobile/teacher_app): analyze, test, test
# against the real server, and build the APK as a downloadable artifact.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "server/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "server/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/teacher_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The app's data layer against the real API and MySQL (tool/live_api_test.sh).
  live-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile/teacher_app
      - run: tool/live_api_test.sh
        working-directory: mobile/teacher_app
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: root

  apk:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/teacher_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The release key comes from repository secrets (see mobile/teacher_app/README.md).
      # Without them the APK is signed with a debug key: fine for trying out,
      # but phones will not update it from a properly signed build later.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      # The school's server address is built in (repository variable TEACHER_APP_API_URL).
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.TEACHER_APP_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-app-apk
          path: mobile/teacher_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
